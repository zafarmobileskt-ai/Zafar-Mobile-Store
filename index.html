<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZAFAR MOBILE STORE - Mobile Inventory & POS</title>
    <meta name="description" content="Comprehensive Mobile Point of Sale (POS), Real-Time IMEI Inventory Tracking, Used Phone Police Protection Verification, Barcode Scanner, and Thermal Receipt Printing System for mobile retail shops." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zafar Mobile" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0B0F17] text-slate-100 antialiased font-sans select-none">
    <div id="root"></div>
    <script>
      // Purge any stale development module caches immediately
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(key) {
            if (key.includes('v5.1') || key.includes('v5.2')) {
              caches.delete(key);
            } else {
              caches.open(key).then(function(cache) {
                cache.keys().then(function(requests) {
                  requests.forEach(function(req) {
                    if (req.url.includes('/src/') || req.url.endsWith('.ts') || req.url.endsWith('.tsx')) {
                      cache.delete(req);
                    }
                  });
                });
              });
            }
          });
        });
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(registration) {
              console.log('[PWA] Service Worker registered successfully with scope:', registration.scope);
              registration.onupdatefound = function() {
                var installingWorker = registration.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = function() {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] New version ready for offline caching.');
                      window.dispatchEvent(new CustomEvent('pwa-update-available'));
                    }
                  };
                }
              };
            })
            .catch(function(error) {
              console.warn('[PWA] Service Worker registration note:', error);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
